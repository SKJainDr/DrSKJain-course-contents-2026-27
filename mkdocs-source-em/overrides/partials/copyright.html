{#-
  Custom override: adds the Invertis University round + rectangular logos
  and a per-site visitor counter above the standard copyright line.
-#}
<div class="md-copyright">
  <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px;">
    <img src="{{ 'assets/brand-orb.jpg' | url }}" alt="Invertis University mark" style="height:26px;width:26px;border-radius:50%;object-fit:cover;">
    <img src="{{ 'assets/invertis-logo.png' | url }}" alt="Invertis University logo" style="height:26px;width:auto;">
  </div>
  {% if config.copyright %}
    <div class="md-copyright__highlight">
      {{ config.copyright }}
    </div>
  {% endif %}
  <div style="margin-top:8px;">
    <img src="https://visitor-badge.laobi.icu/badge?page_id=drskjain-docs-em" alt="Visitor count for this page" style="height:20px;vertical-align:middle;border-radius:4px;opacity:.9;">
  </div>
  {% if not config.extra.generator == false %}
    Made with
    <a href="https://squidfunk.github.io/mkdocs-material/" target="_blank" rel="noopener">
      Material for MkDocs
    </a>
  {% endif %}
</div>
